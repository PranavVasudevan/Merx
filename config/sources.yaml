# BankLens data-source registry.
# The single source of truth for WHERE data comes from and HOW it may be used.
# The serving / MCP layer enforces `license.redistributable` at its boundary.

version: 1

sources:
  fdic_bankfind:
    name: "FDIC BankFind Suite"
    kind: rest_api
    base_url: "https://banks.data.fdic.gov/api"
    auth: none
    cadence: quarterly
    entities: ~4500          # FDIC-insured institutions
    docs: "https://banks.data.fdic.gov/docs/"
    license:
      tag: public-domain-us-gov
      redistributable: true
    status: active           # implemented in Phase 1

  ffiec_cdr:
    name: "FFIEC Central Data Repository (Call Reports / UBPR)"
    kind: bulk + soap_pws
    base_url: "https://cdr.ffiec.gov/public"
    auth: pws_token          # free registration for the Public Web Service
    cadence: quarterly       # available ~45 days after quarter-end
    formats: [tab_delimited, xbrl]
    license: { tag: public-domain-us-gov, redistributable: true }
    status: planned

  sec_edgar:
    name: "SEC EDGAR (ticker/CIK directory + XBRL company facts)"
    kind: rest_api + nightly_bulk
    base_url: "https://data.sec.gov"
    auth: identifying_user_agent
    rate_limit_rps: 10
    cadence: continuous
    license: { tag: public-domain-us-gov, redistributable: true }
    status: active           # implemented in Phase 1j (feeds the CERT<->CIK<->RSSD crosswalk)

  fdic_sod:
    name: "FDIC Summary of Deposits (branch-level footprint)"
    kind: rest_api_bulk
    base_url: "https://banks.data.fdic.gov/api/sod"
    auth: none
    cadence: annual
    entities: ~76000          # branches/year, all FDIC-insured banks
    docs: "https://banks.data.fdic.gov/docs/"
    license: { tag: public-domain-us-gov, redistributable: true }
    status: active           # implemented in Phase 1o (feeds Feature 15's real geo-overlap)
    data_quality_note: >
      STALP/CITY/ADDRESS fields are unreliable at branch level (frozen at the bank's
      HQ address for every branch, verified live) — only SIMS_LATITUDE/SIMS_LONGITUDE
      are trustworthy. See docs/data-contracts/branch_footprint.md.

  fed_nic:
    name: "Federal Reserve NIC (FR Y-9C holding-company data)"
    kind: bulk_zip
    base_url: "https://www.ffiec.gov/npw/FinancialReport/FinancialDataDownload"
    auth: none
    cadence: quarterly
    license: { tag: public-domain-us-gov, redistributable: true }
    status: planned

  fred:
    name: "FRED (macro series)"
    kind: rest_api
    base_url: "https://api.stlouisfed.org/fred"
    auth: api_key            # FRED_API_KEY
    cadence: varies
    license: { tag: public-domain-us-gov, redistributable: true }
    status: planned

  market_ohlc:
    name: "Tiingo (EOD OHLCV)"
    kind: rest_api
    base_url: "https://api.tiingo.com/tiingo/daily"
    auth: api_key            # TIINGO_API_KEY — free tier, no card, but NOT keyless (unlike FDIC/SEC/Fed)
    rate_limit: "250 calls/day, 50 symbols/hour (free tier)"
    cadence: eod
    docs: "https://www.tiingo.com/documentation/end-of-day"
    license:
      tag: commercial-licensed
      redistributable: false     # <-- enforced: display-only, no bulk export via public tools
    status: active           # implemented in Phase 2a; landing requires the user's own free key

  eba_transparency:
    name: "EBA EU-wide Transparency Exercise"
    kind: bulk_download
    base_url: "https://www.eba.europa.eu"
    auth: none
    cadence: semiannual
    entities: ~120           # significant EU/EEA supervised banks
    docs: "https://www.eba.europa.eu/eu-wide-transparency-exercise-0"
    license: { tag: eba-open, redistributable: true }
    status: active            # implemented in Phase 1 (pan-European expansion)
    data_quality_note: >
      Coarser than FDIC's Call Reports: no loan-category concentration, no
      uninsured-deposit split, no branch-level geography (EBA doesn't publish
      either). CET1/Tier1/Total-capital/leverage ratios are reported as raw
      fractions (0.1841 = 18.41%), NOT already-percentages like FDIC's
      IDT1CER/RBCRWAJ/RBC1AAJ — scaled at fetch time, see sources/eba.py.
      Credit-risk/NPL data (tr_cre.csv) deliberately not parsed yet — its
      exposure-class x NACE-sector x performing-status cube needs the SDD.xlsx
      data dictionary to decode correctly.
