; Repo-wide type-checking contract for BankLens — the mypy analogue of
; /ruff.toml's own philosophy (see that file's header): deliberately an
; EXPLICIT, non-strict rule set added to an already-working codebase.
; Adopting mypy --strict at once would mean either mass-annotating every
; function signature in one pass or leaving the check permanently
; non-blocking (`|| true`) — lint theater that catches nothing. Instead this
; enables the checks that catch REAL bugs (an attribute typo on a dict-shaped
; row, a wrong argument type, an unreachable branch) without demanding every
; function already have a full annotation.
;
; Widening this later (turning on disallow_untyped_defs, etc.) is welcome —
; but do it as a deliberate, reviewed change with the fixes in the same
; commit, not by flipping on --strict and hoping.

[mypy]
python_version = 3.11
mypy_path = pipelines/ingestion/src:pipelines/transforms/src:pipelines/orchestration/src:services/mcp-server/src:services/agents/src:libs/python/banklens_common/src
namespace_packages = True
explicit_package_bases = True

; Real-bug checks, on:
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
strict_equality = True

; Not on: this codebase doesn't yet annotate every function signature, and
; requiring that repo-wide before mypy could ever be blocking would repeat
; ruff.toml's own rejected option (b). A function mypy can't infer enough
; about to check simply isn't checked, rather than being an error to fix
; before this can land.
disallow_untyped_defs = False
check_untyped_defs = True

; Third-party packages here (QuantLib, prometheus_client's exact stub
; coverage) either ship no type stubs at all or an incomplete set; failing
; the whole run over a dependency's own gaps would be exactly the kind of
; blanket suppression ruff.toml argues against for OUR code, but it's the
; right call for code we don't own and can't fix.
[mypy-QuantLib.*]
ignore_missing_imports = True

[mypy-duckdb.*]
ignore_missing_imports = True

; QuantLib's SWIG-generated bindings ship no type stubs.
[mypy-QuantLib]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True
