# BankLens Capital Buffer Simulator (Feature 16) — Rust port of
# pipelines/transforms/src/banklens_transforms/stress.py. Deterministic,
# auditable, property-tested money-math. C++/QuantLib is bridged in later for
# duration/curve analytics; this keeps the same modified-duration approximation
# as the Python reference for now, ported line-for-line.
[package]
name = "banklens-stress-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic capital-buffer stress simulator (Feature 16)"
license = "LicenseRef-Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "banklens-stress"
path = "src/main.rs"
