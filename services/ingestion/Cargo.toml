# BankLens production connector SDK (Rust) — the throughput/safety rewrite of
# pipelines/ingestion once data shapes are understood. Skeleton only for now.
[package]
name = "banklens-ingestion"
version = "0.1.0"
edition = "2021"
description = "BankLens Bronze-layer connectors (production, Rust)"
license = "LicenseRef-Proprietary"

[dependencies]
# Uncomment when the Rust toolchain is installed and this phase begins:
# tokio = { version = "1", features = ["full"] }
# reqwest = { version = "0.12", features = ["json", "gzip"] }
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
# arrow = "52"
# object_store = "0.10"

[[bin]]
name = "banklens-ingest"
path = "src/main.rs"
