# BankLens production connector SDK (Rust) — real implementation of the FDIC
# BankFind connector, ported from pipelines/ingestion/src/banklens_ingestion
# (Python reference kept as-is; this is Bronze-layer only, not a full port of
# every source — see src/main.rs and README.md for exact scope).
[package]
name = "banklens-ingestion"
version = "0.1.0"
edition = "2021"
description = "BankLens Bronze-layer connectors (production, Rust)"
license = "LicenseRef-Proprietary"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.20"
regex = "1"

[[bin]]
name = "banklens-ingest"
path = "src/main.rs"
