[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banklens-ingestion"
version = "0.1.0"
description = "BankLens Bronze-layer reference connectors (Phase 1)"
requires-python = ">=3.11"
dependencies = []            # Phase 1 is stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[project.scripts]
banklens-slice = "banklens_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banklens_ingestion"]

[tool.ruff]
# Inherit the repo-wide lint contract (see /ruff.toml). Without this `extend`,
# ruff treats the nearest config as authoritative and this subtree would silently
# fall back to ruff's defaults instead of the agreed rule set.
extend = "../../ruff.toml"
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "../transforms/src"]
testpaths = ["tests"]
