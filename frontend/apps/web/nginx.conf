# Minimal static-file serving for the Vite build. Still no client-side router,
# but the OIDC login flow now redirects back to /callback (see src/auth.ts /
# LoginGate.tsx, checked via window.location.pathname, not a router) — the
# existing try_files fallback below already serves index.html for that path
# with no config change needed, so this comment is the only update required.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
