# Minimal static-file serving for the Vite build. The app is genuinely a single
# page (no client-side router), so no SPA history-fallback rewrite is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
