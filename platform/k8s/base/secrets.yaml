# Structural placeholders only — every value below is intentionally empty and
# MUST NOT be filled in here or committed with real data. See platform/k8s/README.md
# for how these are actually provisioned in a real cluster (SealedSecrets), and
# db.py's `_get()`/`_dsn()` fallback: an empty-string key behaves as "unset", so
# applying this file as-is (e.g. via scripts/k8s_dev_up.ps1) does not change today's
# no-DB-configured local-dev behavior.
apiVersion: v1
kind: Secret
metadata:
  name: banklens-db-credentials
type: Opaque
stringData:
  # Read by libs/python/banklens_common/src/banklens_common/db.py, consumed by
  # both the bridge (watchlist/agent-run/audit persistence) and the refresh
  # CronJob's filings stage (filing_chunks embeddings). DATABASE_URL, if set,
  # takes precedence over the POSTGRES_* fields below.
  DATABASE_URL: ""
  POSTGRES_HOST: ""
  POSTGRES_PORT: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
---
# Bridge-only: services/agents/src/banklens_agents provider clients, invoked from
# bridge_server.py's agent endpoints. Only the key(s) matching BANKLENS_LLM_PROVIDER
# need real values — leave the rest empty.
apiVersion: v1
kind: Secret
metadata:
  name: banklens-llm-keys
type: Opaque
stringData:
  GEMINI_API_KEY: ""
  GEMINI_API_KEY_1: ""
  GEMINI_API_KEY_2: ""
  GEMINI_API_KEY_3: ""
  GEMINI_API_KEY_4: ""
  ANTHROPIC_API_KEY: ""
---
# Refresh-CronJob-only: pipelines/ingestion/src/banklens_ingestion/sources/tiingo.py,
# used by the DAG's market_data stage (quarterly_refresh.py).
apiVersion: v1
kind: Secret
metadata:
  name: banklens-market-data-keys
type: Opaque
stringData:
  TIINGO_API_KEY: ""
