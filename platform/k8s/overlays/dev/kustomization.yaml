apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banklens-dev

resources:
  - ../../base
  - namespace.yaml
  - data-pvc.yaml
  # data-loader.yaml is deliberately NOT here — it's a one-shot bootstrap pod
  # applied directly by scripts/k8s_dev_up.ps1, not part of the running app.

patches:
  - path: bridge-data-patch.yaml
    target:
      kind: Deployment
      name: banklens-bridge
  # Same PVC for the scheduled refresh — it must WRITE to the volume the bridge
  # READS, or a successful refresh would never become visible in the app.
  - path: refresh-data-patch.yaml
    target:
      kind: CronJob
      name: banklens-refresh
  # Local dev only: NodePort so the services are reachable at a fixed local port
  # without needing `kubectl port-forward` running in a separate terminal.
  - target:
      kind: Service
      name: banklens-web
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # The frontend calls the bridge at http://localhost:8791 (hardcoded in
  # src/api.ts), so the bridge needs a fixed host port too — otherwise the
  # browser has nothing to talk to. Same NodePort trick.
  - target:
      kind: Service
      name: banklens-bridge
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30791
