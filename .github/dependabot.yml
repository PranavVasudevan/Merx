# F15 — automated dependency updates across every ecosystem this repo ships:
# Python (3 independently-pinned requirements.txt — see F14), Rust (2 crates,
# each with its own Cargo.lock) and npm (the frontend). Also watches this
# repo's own GitHub Actions pins, so an action referenced by a stale/yanked
# tag gets flagged too.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/libs/python/banklens_common"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/pipelines/transforms"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/services/stress-engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/services/ingestion"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
